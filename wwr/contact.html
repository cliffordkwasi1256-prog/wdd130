<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Contact White Water Rafting for general inquiries, reservation questions, website suggestions, and information about our services.">
  <meta name="author" content="Clifford Fiagbenu">
  <title>Contact Us | White Water Rafting</title>
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

  <header>
    <img src="images/z-splash.png" alt="White Water Rafting logo">

    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html" aria-current="page">Contact Us</a>
    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>

    <div class="contact-wrapper">

      <!-- Company Information -->
      <section class="company-info">
        <h2>Company Information</h2>

        <p>
          River Rush Rafting Co.<br>
          N3/157 Airport Road<br>
          Accra, ID 83549
        </p>

        <p>Phone: (233) 244-719120</p>
        <p>Email: info@riverrushrafting.com</p>

        <div class="map">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3970.7350705936483!2d-0.17069842644637528!3d5.606095494374784!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xfdf9bd982dd591f%3A0xa307bce9552961d5!2sGhana%20Airports%20Company%20Limited%2C%20Airport%20Management!5e0!3m2!1sen!2sgh!4v1791501944203!5m2!1sen!2sgh"
            width="300" height="200" title="Map showing our location" allowfullscreen loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
          </iframe>
        </div>
      </section>

      <!-- Contact Form -->
      <form class="contact-form">

        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required>

        <fieldset>
          <legend>Purpose of Message</legend>

          <input type="radio" id="general" name="purpose" value="General Inquiry" required>
          <label for="general">General Inquiry</label>

          <input type="radio" id="reservation" name="purpose" value="Reservation Question">
          <label for="reservation">Reservation Question</label>

          <input type="radio" id="suggestion" name="purpose" value="Website Suggestion">
          <label for="suggestion">Website Suggestion</label>
        </fieldset>

        <label for="message">Your Message:</label>
        <textarea id="message" name="message" rows="5" placeholder="Type here..."
          required></textarea>

        <div class="newsletter">
          <input type="checkbox" id="newsletter" name="newsletter" value="yes">
          <label for="newsletter">
            Please subscribe me to the monthly newsletter
          </label>
        </div>

        <button type="submit">Send Message</button>

      </form>

    </div>

    <!-- Employee Profiles -->
    <section class="employees">
      <h2>We Are Here to Serve You</h2>

      <figure>
        <img src="images/cliff.png.jpeg" alt="Portrait of Cliff Doe">
        <figcaption>Clifford Doe - Lead Guide</figcaption>
      </figure>

      <figure>
        <img src="images/Richard.png" alt="Portrait of Richard Smith, Safety Coordinator">
        <figcaption>Richard Smith - Safety Coordinator</figcaption>
      </figure>

      <figure>
        <img src="images/Eden.jpeg" alt="Portrait of Eden Brown, Trip Coordinator">
        <figcaption>Eden Brown - Trip Coordinator</figcaption>
      </figure>
    </section>

  </main>

  <!-- Footer -->
  <footer>
    <p>
      &copy; 2026 🌴 White Water Rafting 🌴 Clifford Fiagbenu
    </p>

    <nav class="socialmedia">
      <a href="#" aria-label="Facebook">
        <img src="images/facebook.jpeg" alt="Facebook">
      </a>

      <a href="#" aria-label="Instagram">
        <img src="images/instagram.jpeg" alt="Instagram">
      </a>

      <a href="#" aria-label="LinkedIn">
        <img src="images/key.jpeg" alt="LinkedIn">
      </a>
    </nav>
  </footer>

</body>

</html>
